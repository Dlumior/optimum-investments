# Parámetros del caso asignado. Este archivo alimenta a `make json`, que construye
# data/json/input.json (contrato Anexo 1). El optimizador SOLO lee input.json:
# ningún parámetro relevante puede quedar codificado dentro de las funciones.

schemaVersion: "1.0"
caseId: "C"            # <-- CAMBIAR al caso asignado: A, B, C, D o E
valuationDate: "2025-12-31"
horizonDate: "2026-12-31"   # en el Caso D se usa terminalDate
baseCurrency: "PEN"

# Restricciones comunes (texto del caso, debajo del Cuadro 4)
commonConstraints:
  minNetWorth: 120.0         # S/ mm
  maxLiabilitiesToAssets: 0.85
  minCash: 80.0              # S/ mm, solo si el caso decide sobre activos
  assetBudget: 1000.0
  liabilityBudget: 800.0
  allowShort: false

# Parámetros específicos. Los valores por defecto salen de la hoja Case_Assumptions;
# lo que se escriba aquí los sobrescribe (y debe justificarse en docs/decisiones.md).
caseParameters:
  riskMeasure: "CVAR"        # VOLATILITY | CVAR — Caso C
  bootstrapCount: 500        # escenarios históricos remuestreados; mínimo exigido: 100 (ver D-05)
  # cvarAlpha, bootstrapProbability, stressProbability, riskAversionLambda:
  # se toman de Case_Assumptions (caso C) vía _case_defaults; no se sobrescriben aquí.
  # seed: 20260101
  # Bootstrap por bloques móviles: cada escenario anual = blocksPerScenario bloques de
  # bootstrapBlockLength meses consecutivos (6 × 2 = 12 meses). Ver D-09.
  bootstrapBlockLength: 6
  bootstrapBlocksPerScenario: 2
  # Deriva anual esperada por tipo de factor (ver D-06):
  #   ZERO = cambios centrados; HISTORICAL = media histórica; IRP = paridad de tasas (solo FX).
  drift:
    rates: "ZERO"
    fx: "IRP"
    equity: "HISTORICAL"
  # Nodos de los tramos de Stress_Scenarios_C: override completo en `nodes`, y en `transition`
  # el promedio entre el override y el shift paralelo (evita escalones en la curva). Ver D-11.
  stressTenors:
    short: { nodes: ["ON", "1Y"], transition: ["3Y"] }
    long: { nodes: ["10Y", "20Y"], transition: ["5Y"] }
  # Grilla del barrido de aversión al riesgo (pregunta 4 del Caso C).
  lambdaGrid: [0.0, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0]
  # Límites de vencimiento medidos desde el horizonte (D-20): REPORT = solo se reportan (lectura literal del
  # enunciado: los límites se exigen en t0); ENFORCE = se imponen. output.json trae siempre la variante opuesta.
  horizonMaturityLimits: "REPORT"

# Semilla global para bootstrap/simulaciones (reproducibilidad)
seed: 20251231
