[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimum"
version = "0.1.0"
description = "Caso OP01 Optimum Investments: optimización de riesgo patrimonial (ALM)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "cvxpy>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "pyyaml>=6",
  "jinja2>=3.1",        # DataFrame.style.to_latex
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "jupyterlab>=4",
  "ipykernel>=6",
  "nbstripout>=0.7",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.scripts]
optimum = "optimum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]
